[package]
name = "terminal-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fail-closed lost-link policy engine for AI agents: permissions shrink as human contact ages, with a signed hash-chained audit log."
readme = "README.md"
keywords = ["ai-agent", "policy", "audit-log", "lost-link", "fail-closed"]
categories = ["authentication", "cryptography"]
publish = false

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
hex = "0.4"
proptest = "1"
tempfile = "3"
